
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Explore Vince Patrick's software development projects.">

    <title>Project Details | Vince Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body class="details-page">

    <!-- LOADING SCREEN -->

    <div id="pageLoader" class="page-loader">
        <div class="loader-content">
            <div class="loader-logo">
                Vince<span>Portfolio.</span>
            </div>

            <div class="loader-spinner"></div>

            <p>Loading Project...</p>

            <div class="loader-progress">
                <div class="loader-progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- ANIMATED BACKGROUND -->

    <canvas id="particlesCanvas"></canvas>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>


    <!-- NAVIGATION -->

    <header class="header">
        <nav class="details-navbar">

            <a href="index.html" class="logo">
                Vince<span>Portfolio.</span>
            </a>

            <a href="index.html#projects" class="back-button">
                <i class="fas fa-arrow-left"></i>
                Back to Projects
            </a>

        </nav>
    </header>


    <main class="details-container" id="projectContainer">

        <!-- PROJECT CONTENT IS GENERATED BY JAVASCRIPT -->

    </main>


    <!-- FOOTER -->

    <footer class="details-footer">
        <p>
            © <span id="currentYear"></span>
            Vince Patrick Parcon Maling.
            All Rights Reserved.
        </p>
    </footer>


    <script src="script.js"></script>

    <script>
        // PROJECT INFORMATION

        const projects = {

            "hand-ninja-ai": {
                name: "Hand Ninja AI",
                category: "PERSONAL PROJECT",
                icon: "fa-hand-sparkles",

                description:
                    "A camera-based hand tracking arcade game that uses real-time hand gestures to interact with game objects.",

                overview:
                    "Hand Ninja AI is a Python-based arcade game experiment that combines computer vision and interactive gameplay. It uses a webcam to detect hand movements and allows players to interact with objects through natural hand gestures.",

                features: [
                    "Real-time hand tracking using a webcam.",
                    "Hand gesture-based interaction.",
                    "Arcade-style fruit and bomb gameplay.",
                    "Visual hand landmark tracking.",
                    "Game scoring and lives system."
                ],

                technologies: [
                    "Python",
                    "OpenCV",
                    "MediaPipe",
                    "NumPy",
                    "Pygame"
                ],

                learning:
                    "This project helped me explore computer vision, gesture recognition, real-time camera processing, and interactive game development."
            },


            "face-tracking-ai": {
                name: "Face Tracking AI Scanner",
                category: "PERSONAL PROJECT",
                icon: "fa-user-check",

                description:
                    "A face tracking experiment that detects faces and displays different scanning and recognition-style visual states.",

                overview:
                    "Face Tracking AI Scanner is a computer vision project developed using Python. It uses a camera to detect and track faces, then displays a futuristic scanner interface with different visual states based on detection.",

                features: [
                    "Real-time face detection.",
                    "Face tracking through a webcam.",
                    "Scanning and detection visual effects.",
                    "Different scanner interface states.",
                    "Interactive visual feedback."
                ],

                technologies: [
                    "Python",
                    "OpenCV",
                    "MediaPipe",
                    "Computer Vision"
                ],

                learning:
                    "This project allowed me to experiment with face detection, camera processing, visual interfaces, and real-time computer vision applications."
            },


            "qr-attendance-system": {
                name: "QR Code Attendance System",
                category: "DEVELOPMENT PROJECT",
                icon: "fa-qrcode",

                description:
                    "A QR code-based attendance project designed to support scanning and recording attendance information.",

                overview:
                    "QR Code Attendance System is a Python development project focused on simplifying attendance recording through QR code scanning. The application uses a camera-based scanner to read QR codes and process attendance information.",

                features: [
                    "QR code scanning through a camera.",
                    "Attendance information processing.",
                    "Duplicate attendance checking.",
                    "Attendance recording.",
                    "Scanner-based interaction."
                ],

                technologies: [
                    "Python",
                    "OpenCV",
                    "QR Code",
                    "Database"
                ],

                learning:
                    "This project helped me understand QR code processing, camera integration, attendance workflows, and data management."
            }

        };


        // GET PROJECT FROM URL

        const params = new URLSearchParams(window.location.search);

        const projectId = params.get("project");

        const project = projects[projectId];

        const projectContainer =
            document.getElementById("projectContainer");


        // DISPLAY PROJECT

        if (project) {

            document.title =
                project.name + " | Vince Portfolio";

            projectContainer.innerHTML = `

                <section class="details-hero">

                    <div class="details-icon">
                        <i class="fas ${project.icon}"></i>
                    </div>

                    <span class="details-category">
                        ${project.category}
                    </span>

                    <h1>
                        ${project.name}
                    </h1>

                    <p>
                        ${project.description}
                    </p>

                    <div class="details-tags">
                        ${project.technologies.map(tech =>
                            `<span>${tech}</span>`
                        ).join("")}
                    </div>

                </section>


                <section class="details-content">

                    <article class="details-card">

                        <h2>
                            <i class="fas fa-circle-info"></i>
                            Project Overview
                        </h2>

                        <p>
                            ${project.overview}
                        </p>

                    </article>


                    <article class="details-card">

                        <h2>
                            <i class="fas fa-star"></i>
                            Key Features
                        </h2>

                        <ul>
                            ${project.features.map(feature =>
                                `<li>${feature}</li>`
                            ).join("")}
                        </ul>

                    </article>


                    <article class="details-card">

                        <h2>
                            <i class="fas fa-code"></i>
                            Technologies Used
                        </h2>

                        <div class="details-tech">
                            ${project.technologies.map(tech =>
                                `<span>${tech}</span>`
                            ).join("")}
                        </div>

                    </article>


                    <article class="details-card">

                        <h2>
                            <i class="fas fa-lightbulb"></i>
                            What I Learned
                        </h2>

                        <p>
                            ${project.learning}
                        </p>

                    </article>

                </section>


                <div class="details-actions">

                    <a href="index.html#projects">
                        <i class="fas fa-arrow-left"></i>
                        Back to Projects
                    </a>

                    <a href="https://github.com/vincep899-ai"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="secondary-action">

                        <i class="fab fa-github"></i>
                        Visit My GitHub

                    </a>

                </div>

            `;

        } else {

            projectContainer.innerHTML = `

                <div class="details-not-found">

                    <i class="fas fa-folder-open"
                       style="font-size:55px;color:var(--primary);">
                    </i>

                    <h1 style="margin:20px 0;">
                        Project Not Found
                    </h1>

                    <p>
                        Sorry, the requested project could not be found.
                    </p>

                    <br>

                    <a href="index.html#projects"
                       class="btn primary-btn">

                        <i class="fas fa-arrow-left"></i>
                        Return to Projects

                    </a>

                </div>

            `;

        }

    </script>

</body>
</html>
